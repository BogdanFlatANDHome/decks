<!-- Шаблон главной. Карточки вставляет tools/index.py вместо __CARDS__; index.html руками не править -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Продукты Wolf Consult — презентации</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --card: #fff; --line: #e4e2e6; --text: #1d1c21; --muted: #6b6a72; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --card: #1f1f1f; --line: #333; --text: #f4f4f4; --muted: #a8a8a8; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 56px 20px 72px; background: var(--bg); color: var(--text);
    font: 17px/1.5 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; }
  .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 32px; font-size: clamp(28px, 4vw, 40px); line-height: 1.15; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 24px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.12); border-color: var(--accent); }
  .thumb { display: block; aspect-ratio: 16 / 9; width: 100%; height: auto; object-fit: cover; border-bottom: 1px solid var(--line); background: #ddd; }
  .body { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px 18px; flex: 1; }
  .title { font-size: 19px; font-weight: 600; }
  .title a { color: inherit; text-decoration: none; }
  .title a::after { content: ""; position: absolute; inset: 0; }
  .desc { color: var(--muted); font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; font-size: 14px; font-weight: 600; }
  .open { color: var(--accent); }
  .pdf { position: relative; z-index: 1; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .pdf:hover { color: var(--text); border-color: var(--text); }
</style>
</head>
<body>
<main>
  <p class="kicker">Wolf Consult</p>
  <h1>Наши продукты</h1>
  <div class="grid">
__CARDS__
  </div>
</main>
</body>
</html>
