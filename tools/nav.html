<!-- deck-nav:start — панель стрелок и кнопка PDF; вставляет tools/build.py, руками не править -->
<style id="deck-nav-css">
  #deck-nav { --deck-accent: #EF4B5C; position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9000;
    display: flex; align-items: center; gap: 6px; padding: 3px; border-radius: 999px;
    background: rgba(29, 28, 33, .72); box-shadow: 0 3px 12px rgba(0,0,0,.2);
    font: 600 12px/1 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
  #deck-nav button { width: 26px; height: 26px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--deck-accent); color: #fff; display: grid; place-items: center; padding: 0;
    transition: transform .12s, opacity .2s, filter .2s; }
  #deck-nav button:hover { filter: brightness(.9); transform: scale(1.08); }
  #deck-nav button:active { transform: scale(.94); }
  #deck-nav button:disabled { opacity: .3; cursor: default; transform: none; filter: none; }
  #deck-nav svg { width: 14px; height: 14px; }
  #deck-nav .deck-nav-count { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  #deck-nav .deck-nav-pdf { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 8px;
    border-radius: 999px; background: #fff; color: #1D1C21; text-decoration: none; margin-left: 2px; }
  #deck-nav .deck-nav-pdf:hover { background: #f1eeea; }
  #deck-nav .deck-nav-pdf svg { width: 12px; height: 12px; }
  #deck-nav .deck-nav-home { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 8px;
    border-radius: 999px; color: #fff; text-decoration: none; margin-right: 2px; transition: background .2s; }
  #deck-nav .deck-nav-home:hover { background: rgba(255,255,255,.14); }
  #deck-nav .deck-nav-home svg { width: 12px; height: 12px; }
  @media print { #deck-nav { display: none !important; } }
</style>
<script id="deck-nav-js" data-pdf="__PDF__">
(function () {
  var pdf = document.currentScript && document.currentScript.dataset.pdf
  var icon = function (d) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'
  }
  function accent() {
    try { return JSON.parse(document.getElementById('bento-doc').textContent).theme.accent } catch (e) { return null }
  }
  function init() {
    var ctr = document.querySelector('.reveal .controls')
    if (!ctr) return setTimeout(init, 200)
    var L = ctr.querySelector('.navigate-left'), R = ctr.querySelector('.navigate-right')
    var nav = document.createElement('div')
    nav.id = 'deck-nav'
    var a = accent()
    if (a) nav.style.setProperty('--deck-accent', a)
    nav.innerHTML = '<a class="deck-nav-home" href="./">' + icon('M19 12H5M11 6l-6 6 6 6') + 'Все продукты</a>' +
      '<button type="button" aria-label="Предыдущий слайд" data-dir="prev">' + icon('M15 5l-7 7 7 7') + '</button>' +
      '<span class="deck-nav-count"></span>' +
      '<button type="button" aria-label="Следующий слайд" data-dir="next">' + icon('M9 5l7 7-7 7') + '</button>' +
      (pdf ? '<a class="deck-nav-pdf" href="' + pdf + '" download>' + icon('M12 4v11M7 10l5 5 5-5M5 20h14') + 'PDF</a>' : '')
    document.body.appendChild(nav)
    var bp = nav.querySelector('[data-dir=prev]'), bn = nav.querySelector('[data-dir=next]'), cnt = nav.querySelector('.deck-nav-count')
    bp.onclick = function (e) { e.stopPropagation(); L.click() }
    bn.onclick = function (e) { e.stopPropagation(); R.click() }
    nav.querySelectorAll('a').forEach(function (l) { l.addEventListener('click', function (e) { e.stopPropagation() }) })
    var sync = function () {
      bp.disabled = L.disabled
      bn.disabled = R.disabled
      var n = document.querySelector('.reveal .slide-number')
      cnt.textContent = n ? n.textContent.replace(/\s+/g, ' ').trim() : ''
    }
    new MutationObserver(sync).observe(document.querySelector('.reveal'), { attributes: true, childList: true, subtree: true, characterData: true })
    sync()
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init()
})()
</script>
<!-- deck-nav:end -->
